name: smartfactory

networks:
  smartfactory-net:
    driver: bridge

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
  alerts-data:

services:
  # ============================================================================
  # Broker 1 do Apache Kafka (KRaft Mode - Broker & Controller)
  # ============================================================================
  kafka-1:
    image: apache/kafka:3.7.0
    container_name: smartfactory-kafka-1
    hostname: kafka-1
    networks:
      - smartfactory-net
    ports:
      - "9092:9092"
    environment:
      PATH: "/opt/kafka/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-1:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "4L622nShTUiBenYhCy-0bw"
    volumes:
      - kafka1-data:/var/lib/kafka/data
    restart: unless-stopped

  # ============================================================================
  # Broker 2 do Apache Kafka (KRaft Mode - Broker & Controller)
  # ============================================================================
  kafka-2:
    image: apache/kafka:3.7.0
    container_name: smartfactory-kafka-2
    hostname: kafka-2
    networks:
      - smartfactory-net
    ports:
      - "9094:9092"
    environment:
      PATH: "/opt/kafka/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-2:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "4L622nShTUiBenYhCy-0bw"
    volumes:
      - kafka2-data:/var/lib/kafka/data
    restart: unless-stopped

  # ============================================================================
  # Broker 3 do Apache Kafka (KRaft Mode - Broker & Controller)
  # ============================================================================
  kafka-3:
    image: apache/kafka:3.7.0
    container_name: smartfactory-kafka-3
    hostname: kafka-3
    networks:
      - smartfactory-net
    ports:
      - "9096:9092"
    environment:
      PATH: "/opt/kafka/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-3:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "4L622nShTUiBenYhCy-0bw"
    volumes:
      - kafka3-data:/var/lib/kafka/data
    restart: unless-stopped

  # ============================================================================
  # Produtor 1: Sensor de Usinagem (Setor Linha de Produção)
  # ============================================================================
  producer-linha-producao:
    build:
      context: ./producer
      dockerfile: Dockerfile
    image: smartfactory-producer:latest
    container_name: smartfactory-producer-1
    networks:
      - smartfactory-net
    env_file:
      - config/sensor_thresholds.env
    environment:
      SENSOR_ID: "sensor-usinagem-01"
      SENSOR_SETOR: "linha_producao"
      INTERVALO_ENVIO_SEG: "2.0"
      CHANCE_ANOMALIA_PERCENTUAL: "15"
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    restart: unless-stopped

  # ============================================================================
  # Produtor 2: Sensor de Chiller (Setor Refrigeração)
  # ============================================================================
  producer-refrigeracao:
    build:
      context: ./producer
      dockerfile: Dockerfile
    image: smartfactory-producer:latest
    container_name: smartfactory-producer-2
    networks:
      - smartfactory-net
    env_file:
      - config/sensor_thresholds.env
    environment:
      SENSOR_ID: "sensor-chiller-01"
      SENSOR_SETOR: "refrigeracao"
      INTERVALO_ENVIO_SEG: "2.0"
      CHANCE_ANOMALIA_PERCENTUAL: "15"
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    restart: unless-stopped

  # ============================================================================
  # Produtor 3: Sensor de Esteira (Setor Empacotamento)
  # ============================================================================
  producer-empacotamento:
    build:
      context: ./producer
      dockerfile: Dockerfile
    image: smartfactory-producer:latest
    container_name: smartfactory-producer-3
    networks:
      - smartfactory-net
    env_file:
      - config/sensor_thresholds.env
    environment:
      SENSOR_ID: "sensor-esteira-01"
      SENSOR_SETOR: "empacotamento"
      INTERVALO_ENVIO_SEG: "2.0"
      CHANCE_ANOMALIA_PERCENTUAL: "15"
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    restart: unless-stopped

  # ============================================================================
  # Produtor 4: Sensor de Forno (Setor Fundição)
  # ============================================================================
  producer-fundicao:
    build:
      context: ./producer
      dockerfile: Dockerfile
    image: smartfactory-producer:latest
    container_name: smartfactory-producer-4
    networks:
      - smartfactory-net
    env_file:
      - config/sensor_thresholds.env
    environment:
      SENSOR_ID: "sensor-forno-01"
      SENSOR_SETOR: "fundicao"
      INTERVALO_ENVIO_SEG: "2.5"
      CHANCE_ANOMALIA_PERCENTUAL: "15"
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    restart: unless-stopped

  # ============================================================================
  # Consumidores: Processadores de Telemetria e Detecção de Anomalias
  # Iniciado com 3 réplicas para balancear perfeitamente as 3 partições
  # ============================================================================
  consumer:
    build:
      context: ./consumer
      dockerfile: Dockerfile
    image: smartfactory-consumer:latest
    networks:
      - smartfactory-net
    env_file:
      - config/sensor_thresholds.env
    environment:
      KAFKA_GROUP_ID: "smartfactory-processors"
    volumes:
      - alerts-data:/var/log/smartfactory
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    deploy:
      replicas: 3
    restart: unless-stopped
