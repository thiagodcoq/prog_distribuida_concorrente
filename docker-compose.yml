name: smartfactory

networks:
  smartfactory-net:
    driver: bridge

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
  alerts-data:

# Blocos reutilizáveis (âncoras YAML): evitam repetir a configuração dos 3 brokers
# e dos 4+ produtores. Parâmetros de aplicação vêm de config/sensor_thresholds.env.

# Configuração comum a todos os brokers (topologia: P=3, R=3, min.insync.replicas=2,
# coerente com TOPIC_* em config/sensor_thresholds.env)
x-kafka-env: &kafka-env
  PATH: "/opt/kafka/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
  KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  CLUSTER_ID: "4L622nShTUiBenYhCy-0bw"

x-kafka: &kafka
  image: apache/kafka:3.7.0
  networks:
    - smartfactory-net
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
    interval: 5s
    timeout: 10s
    retries: 24
    start_period: 10s
  restart: unless-stopped

x-kafka-deps: &kafka-deps
  kafka-1:
    condition: service_healthy
  kafka-2:
    condition: service_healthy
  kafka-3:
    condition: service_healthy

x-producer: &producer
  image: smartfactory-producer:latest
  networks:
    - smartfactory-net
  env_file:
    - config/sensor_thresholds.env
  depends_on: *kafka-deps
  restart: unless-stopped

services:
  # Cluster Kafka em modo KRaft: 3 nós broker+controller (quórum de 2 em 3)
  kafka-1:
    <<: *kafka
    container_name: smartfactory-kafka-1
    hostname: kafka-1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-1:9092"
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka
    container_name: smartfactory-kafka-2
    hostname: kafka-2
    ports:
      - "9094:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-2:9092"
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka
    container_name: smartfactory-kafka-3
    hostname: kafka-3
    ports:
      - "9096:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-3:9092"
    volumes:
      - kafka3-data:/var/lib/kafka/data

  # Construção da imagem do produtor (uma única vez, compartilhada pelos sensores).
  # Só participa de `make build` (profile "build"); nunca é iniciado.
  producer-image:
    profiles: ["build"]
    build:
      context: ./producer
      dockerfile: Dockerfile
    image: smartfactory-producer:latest

  # Sensores (produtores): mesma imagem, perfil do setor por variáveis de ambiente.
  # SENSOR_ID é a chave de partição do Kafka: escolhida para que os sensores se
  # distribuam por P0, P1 e P2 (verificado por `make test-balance`).
  producer-linha-producao:
    <<: *producer
    container_name: smartfactory-producer-1
    environment:
      SENSOR_ID: "sensor-usinagem-01"
      SENSOR_SETOR: "linha_producao"
      TEMP_BASE: "65.0"
      VIB_BASE: "2.5"
      KW_BASE: "15.0"

  producer-refrigeracao:
    <<: *producer
    container_name: smartfactory-producer-2
    environment:
      SENSOR_ID: "sensor-chiller-02"
      SENSOR_SETOR: "refrigeracao"
      TEMP_BASE: "5.0"
      VIB_BASE: "1.8"
      KW_BASE: "22.0"

  producer-empacotamento:
    <<: *producer
    container_name: smartfactory-producer-3
    environment:
      SENSOR_ID: "sensor-esteira-01"
      SENSOR_SETOR: "empacotamento"
      TEMP_BASE: "45.0"
      VIB_BASE: "2.0"
      KW_BASE: "12.0"

  producer-fundicao:
    <<: *producer
    container_name: smartfactory-producer-4
    environment:
      SENSOR_ID: "sensor-forno-01"
      SENSOR_SETOR: "fundicao"
      INTERVALO_ENVIO_SEG: "2.5"
      # Regime nominal abaixo dos limites de aviso globais (75 °C / 25 kW); sem isso
      # o forno geraria alerta a cada leitura.
      TEMP_BASE: "70.0"
      VIB_BASE: "3.2"
      KW_BASE: "22.0"

  # Sensores adicionais para demonstrar escala de produtores:
  #   make scale-sensors N=8
  # SENSOR_ID é derivado do hostname de cada réplica.
  sensor-extra:
    <<: *producer
    profiles: ["scale"]
    environment:
      SENSOR_SETOR: "linha_producao"
      TEMP_BASE: "60.0"
      VIB_BASE: "2.5"
      KW_BASE: "15.0"

  # Consumidores: processadores de telemetria e detecção de anomalias.
  # Iniciam com 3 réplicas (uma por partição); escalar com `docker compose up --scale`.
  consumer:
    build:
      context: ./consumer
      dockerfile: Dockerfile
    image: smartfactory-consumer:latest
    networks:
      - smartfactory-net
    env_file:
      - config/sensor_thresholds.env
    environment:
      # Custo simulado por mensagem (ms). 0 = desligado. Sobrescrito pelo teste de
      # elasticidade: PROCESSING_DELAY_MS=20 docker compose up -d consumer
      PROCESSING_DELAY_MS: "${PROCESSING_DELAY_MS:-0}"
    volumes:
      - alerts-data:/var/log/smartfactory
    depends_on: *kafka-deps
    deploy:
      replicas: 3
    restart: unless-stopped
